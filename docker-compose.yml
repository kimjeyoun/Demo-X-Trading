# demo-x-trading/docker-compose.yml

version: '3.8' # Docker Compose 버전

services:
  # 1. MySQL 데이터베이스 서비스 설정
  db:
    image: mysql:8.0 # MySQL 8.0 버전 이미지를 사용
    container_name: demo-x-mysql # 컨테이너 이름
    restart: always # Docker가 실행될 때 항상 자동으로 시작
    environment:
      MYSQL_DATABASE: 'demo_x_trading' # 생성될 데이터베이스 이름
      MYSQL_ROOT_PASSWORD: 'rootpassword' # 루트 계정 비밀번호 (개발용)
      TZ: 'Asia/Seoul' # 타임존 설정
    ports:
      - "3307:3306" # 내 컴퓨터의 3306 포트와 Docker 컨테이너의 3306 포트를 연결
    volumes:
      - ./data/mysql:/var/lib/mysql # 데이터를 내 컴퓨터에 저장하여 컨테이너가 삭제돼도 데이터가 유지되도록 함
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # 2. Redis 인메모리 DB 서비스 설정
  redis:
    image: redis:latest # 최신 Redis 이미지를 사용
    container_name: demo-x-redis # 컨테이너 이름
    restart: always
    ports:
      - "6380:6379" # 내 컴퓨터의 6379 포트와 Docker 컨테이너의 6379 포트를 연결
    volumes:
      - ./data/redis:/data